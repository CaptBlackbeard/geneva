<html lang="en">

<title>Geneva, on the map</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
      crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  :root{
    --terracotta:#C8102E; --olive:#1F5673; --cream:#F7F6F2; --gold:#D9A520; --wine:#14212B;
    --plum:#7A4E7E; --ink:#372C24; --ink-soft:#6E5F52; --page:#FAF3E7; --surface:#FFFDF8;
    --rule:#E3D5BC;
    --display:"Archivo",Georgia,"Times New Roman",serif;
    --body:"Source Serif 4",Georgia,"Times New Roman",serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --page:#1E1512; --surface:#291D18; --ink:#F1E3D1; --ink-soft:#C3AE98; --rule:#463229;
      --terracotta:#E2475E; --gold:#E7BE4E; --plum:#B083B4; color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  html{height:100%;background:#FAF3E7;background:var(--page,#FAF3E7)}
  body{margin:0;height:100%;display:flex;flex-direction:column;
       background:#FAF3E7;background:var(--page,#FAF3E7);
       color:#372C24;color:var(--ink,#372C24);
       font-family:Georgia,serif;font-family:var(--body);font-size:16px}
  header{flex:0 0 auto;padding:.7rem 16px calc(.7rem);border-bottom:1px solid var(--rule);
         background:var(--surface);display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center}
  header h1{font-family:var(--display);font-weight:600;font-size:1.45rem;margin:0;color:var(--wine);
            line-height:1.1}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header h1{color:#F3D9B8}}
  .back{font-size:.95rem;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--gold)}
  .back:hover{color:var(--terracotta)}
  .spacer{flex:1 1 auto}
  .cities{display:flex;gap:.4rem}
  .cities button, .reset{font-family:var(--display);font-size:1rem;letter-spacing:.04em;cursor:pointer;
    background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:999px;
    padding:.3rem .85rem}
  .cities button[aria-pressed="true"]{background:var(--olive);color:#FCF4E6;border-color:var(--olive)}
  #map{flex:1 1 auto;min-height:0;width:100%;background:var(--rule)}
  .legend{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:.5rem 1.1rem;align-items:center;
          padding:.65rem 16px calc(.65rem + env(safe-area-inset-bottom,0px));
          border-top:1px solid var(--rule);background:var(--surface);font-size:.92rem}
  .key{display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;user-select:none}
  .key input{margin:0}
  .dot{width:13px;height:13px;border-radius:50%;border:2px solid #FFFDF8;
       box-shadow:0 0 0 1px rgba(0,0,0,.25);display:inline-block}
  .hint{color:var(--ink-soft);font-style:italic;font-size:.88rem}
  .pin{border-radius:50%;border:2px solid #FFFDF8;box-shadow:0 1px 4px rgba(0,0,0,.45)}
  .pin.hotel{width:19px;height:19px;border-width:3px}
  .pin.option{border-radius:3px}
  .pin.coffee{box-shadow:0 1px 4px rgba(0,0,0,.45), inset 0 0 0 3px rgba(255,253,248,.92)}
  .dot.sq{border-radius:3px}
  .dot.ring{box-shadow:0 0 0 1px rgba(0,0,0,.25), inset 0 0 0 3px rgba(255,253,248,.92)}
  .leaflet-popup-content-wrapper{border-radius:4px;background:var(--surface);color:var(--ink)}
  .leaflet-popup-tip{background:var(--surface)}
  .leaflet-popup-content{margin:.7rem .85rem;font-family:var(--body);font-size:.95rem;line-height:1.45}
  .pop-n{font-family:var(--display);font-size:1.2rem;font-weight:600;color:var(--wine);display:block}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pop-n{color:#F3D9B8}}
  .pop-a{color:var(--ink-soft);font-style:italic}
  .pop-d{display:block;margin-top:.25rem}
  .pop-w{display:block;margin-top:.4rem;padding-top:.4rem;border-top:1px solid var(--rule);
         color:var(--olive);font-weight:500}
  .walkbtn{margin-top:.5rem;font-family:var(--display);font-size:.95rem;cursor:pointer;
    background:var(--wine);color:#FCF4E6;border:1px solid var(--gold);border-radius:999px;padding:.25rem .7rem}
  .panel{position:absolute;right:10px;top:10px;z-index:1000;max-width:230px;background:var(--surface);
         border:1px solid var(--rule);border-radius:4px;padding:.6rem .75rem;font-size:.9rem;
         box-shadow:0 4px 14px rgba(0,0,0,.2)}
  .panel b{font-family:var(--display);font-size:1.05rem}
  .panel .close{float:right;cursor:pointer;color:var(--ink-soft);border:0;background:none;font-size:1rem}
  @media (max-width:560px){
    header h1{font-size:1.2rem;width:100%}
    .legend{font-size:.85rem;gap:.4rem .8rem}
    .panel{max-width:180px;font-size:.84rem}
  }
</style>
</head>

<header>
  <h1>Geneva, on the map</h1>
  <a class="back" href="../">&larr; back to the itinerary</a>

<div id="map"></div>

  <label class="key"><input type="checkbox" data-cat="eat" checked><span class="dot" style="background:#C8102E"></span>Restaurants</label>
  <label class="key"><input type="checkbox" data-cat="wine" checked><span class="dot" style="background:#7A3B5E"></span>Wine</label>
  <label class="key"><input type="checkbox" data-cat="chocolate" checked><span class="dot" style="background:#6F4E37"></span>Chocolate</label>
  <label class="key"><input type="checkbox" data-cat="coffee" checked><span class="dot ring" style="background:#A0672F"></span>Coffee</label>
  <label class="key"><input type="checkbox" data-cat="option" checked><span class="dot sq" style="background:#5E8C9E"></span>If plans change</label>
  <label class="key"><input type="checkbox" data-cat="ski" checked><span class="dot" style="background:#36584A"></span>Ski day</label>
  <span class="hint">Tap a hotel to see what is within a 5, 10 and 15 minute walk.</span>
</div>

<script>
const PLACES = [{"n": "La Réserve Genève", "c": "hotel", "city": "Geneva", "lat": 46.250402, "lng": 6.149405, "a": "Route de Lausanne 301", "d": "", "u": "https://www.lareserve-geneve.com/en/", "t": "https://www.tripadvisor.com/Hotel_Review-g1190139-d228195-Reviews-La_Reserve_Hotel_Spa_And_Villa-Bellevue_Geneva.html"}, {"n": "Eastwest Hotel by Malone", "c": "hotel", "city": "Geneva", "lat": 46.209797, "lng": 6.148215, "a": "Rue des Pâquis 6", "d": "", "u": "https://www.eastwesthotel.ch/en/", "t": "https://www.tripadvisor.com/Hotel_Review-g188057-d817240-Reviews-Eastwest_Hotel_By_Malone-Geneva.html"}, {"n": "Hotel Edelweiss (Manotel)", "c": "hotel", "city": "Geneva", "lat": 46.211398, "lng": 6.14992, "a": "Place de la Navigation 2", "d": "", "u": "https://www.hoteledelweissgeneva.com/en/", "t": "https://www.tripadvisor.com/Hotel_Review-g188057-d228211-Reviews-Hotel_Edelweiss-Geneva.html"}, {"n": "Novotel Genève Centre", "c": "hotel", "city": "Geneva", "lat": 46.211415, "lng": 6.147265, "a": "Rue de Zurich 19", "d": "", "u": "https://all.accor.com/hotel/3133/index.en.shtml", "t": "https://www.tripadvisor.com/Hotel_Review-g188057-d497890-Reviews-Novotel_Geneve_Centre-Geneva.html"}, {"n": "Stay KooooK Geneva City", "c": "hotel", "city": "Geneva", "lat": 46.213219, "lng": 6.13016, "a": "Rue de la Servette 93", "d": "", "u": "https://www.staykooook.com/geneva-city/", "t": "https://www.tripadvisor.com/Hotel_Review-g188057-d27429602-Reviews-Stay_KooooK_Genf_City-Geneva.html"}, {"n": "ibis Genève Centre Lac", "c": "hotel", "city": "Geneva", "lat": 46.210517, "lng": 6.146237, "a": "Rue de Berne 26", "d": "", "u": "https://all.accor.com/hotel/9577/index.en.shtml", "t": "https://www.tripadvisor.com/Hotel_Review-g188057-d11917162-Reviews-Ibis_Geneve_Centre_Lac-Geneva.html"}, {"n": "Jet d'Eau", "c": "sight", "city": "Geneva", "lat": 46.207381, "lng": 6.155889, "a": "Quai Gustave-Ador", "d": "Toddlers love walking the jetty toward the 140 m plume - expect spray, rainbows and giggles; free.", "u": "https://ww2.sig-ge.ch/en/a-propos-de-sig/nous-connaitre/sites_expositions/jet_deau", "t": "https://www.tripadvisor.com/Attraction_Review-g188057-d195995-Reviews-Jet_d_Eau-Geneva.html"}, {"n": "Old Town & St Pierre Cathedral towers", "c": "sight", "city": "Geneva", "lat": 46.201009, "lng": 6.147897, "a": "Cour de Saint-Pierre", "d": "157 tower steps to rooftop views; a two-year-old has managed it slowly - carrier recommended on cobbles.", "u": "https://www.geneve.com/fr/attractions/detail/tours-de-la-cathedrale-saint-pierre", "t": "https://www.tripadvisor.com/Attraction_Review-g188057-d310772-Reviews-Cathedrale_Saint_Pierre-Geneva.html"}, {"n": "Maison Tavel", "c": "option", "city": "Geneva", "lat": 46.201512, "lng": 6.146995, "a": "Rue du Puits-Saint-Pierre 6", "d": "Old Town's oldest house with a huge model of 1850 Geneva toddlers can peer at; short, indoor, cheap.", "u": "https://www.geneve.ch/maison-tavel", "t": "https://www.tripadvisor.com/Attraction_Review-g188057-d195989-Reviews-Maison_Tavel-Geneva.html"}, {"n": "Parc des Bastions & Reformation Wall", "c": "sight", "city": "Geneva", "lat": 46.200624, "lng": 6.1446, "a": "Promenade des Bastions 1", "d": "Big shady lawns, a playground and near-child-sized giant chess pieces right below the Old Town.", "u": "https://www.geneve.ch/promenade-bastions", "t": "https://www.tripadvisor.com/Attraction_Review-g188057-d6219158-Reviews-Parc_Des_Bastions-Geneva.html"}, {"n": "Parc La Grange (rose garden + playground) & Baby-Plage", "c": "sight", "city": "Geneva", "lat": 46.206098, "lng": 6.167509, "a": "Quai Gustave-Ador", "d": "Best toddler combo: fenced-in playground with sand and paddling pool, then the free Baby-Plage beach next door.", "u": "https://www.geneve.ch/place-jeux-parc-grange", "t": "https://www.tripadvisor.com/Attraction_Review-g188057-d6277988-Reviews-Parc_La_Grange-Geneva.html"}, {"n": "Bains des Pâquis", "c": "sight", "city": "Geneva", "lat": 46.210156, "lng": 6.1544, "a": "Quai du Mont-Blanc 30", "d": "Iconic lakeside jetty for a cheap look at the Jet d'Eau and a lunch or winter fondue.", "u": "https://aubp.ch/", "t": "https://www.tripadvisor.com/Attraction_Review-g188057-d3203924-Reviews-Bains_des_Paquis-Geneva.html"}, {"n": "Genève-Plage", "c": "option", "city": "Geneva", "lat": 46.21316, "lng": 6.173543, "a": "Quai de Cologny 5", "d": "Fenced lido with pools, lawn and lake access - a contained summer swim day with a toddler.", "u": "https://www.geneve.com/en/attractions/geneva-beach", "t": ""}, {"n": "Jardin Botanique de Genève (with animal park)", "c": "sight", "city": "Geneva", "lat": 46.227632, "lng": 6.146739, "a": "Chemin de l'Impératrice 1", "d": "Free gardens with deer, flamingos, goats and peacocks, a playground and greenhouses for rainy spells.", "u": "https://www.jardinbotaniquegeneve.ch/", "t": "https://www.tripadvisor.com/Attraction_Review-g3284927-d7072743-Reviews-Conservatoire_et_Jardin_botaniques_de_Geneve-Pregny_Chambesy_Geneva.html"}, {"n": "Parc aux animaux du Bois de la Bâtie", "c": "option", "city": "Geneva", "lat": 46.198908, "lng": 6.122289, "a": "Chemin de la Bâtie 28", "d": "Free hilltop mini-zoo of 300+ farm and native animals - ibex, pigs, goats, peacocks - in the woods.", "u": "https://www.geneve.ch/parc-animalier-bois-batie", "t": "https://www.tripadvisor.com/Attraction_Review-g188057-d10484075-Reviews-Parc_aux_animaux_du_Bois_de_la_Batie-Geneva.html"}, {"n": "Patek Philippe Museum", "c": "option", "city": "Geneva", "lat": 46.1984, "lng": 6.138267, "a": "Rue des Vieux-Grenadiers 7", "d": "Glittering automata and tiny watches for a short indoor stop; under-18s free, but hands-off, no photos.", "u": "https://www.patek.com/en/museum/the-patek-philippe-museum", "t": "https://www.tripadvisor.com/Attraction_Review-g188057-d270579-Reviews-Patek_Phillipe_Museum-Geneva.html"}, {"n": "Palais des Nations & Broken Chair", "c": "option", "city": "Geneva", "lat": 46.22287, "lng": 6.138357, "a": "Place des Nations", "d": "Broken Chair and Place des Nations fountains are free to splash-watch; the UN tour suits older kids.", "u": "https://www.ungeneva.org/en/visit", "t": "https://www.tripadvisor.com/Attraction_Review-g188057-d1529701-Reviews-Palais_des_Nations-Geneva.html"}, {"n": "Carouge", "c": "sight", "city": "Geneva", "lat": 46.184199, "lng": 6.141347, "a": "Place du Marché", "d": "Pastel Sardinian-style village streets, a Saturday market and cafés, 15 minutes by tram from the centre.", "u": "https://www.carouge.ch/", "t": "https://www.tripadvisor.com/Attraction_Review-g664427-d195994-Reviews-Ville_de_Carouge-Carouge_Canton_of_Geneva.html"}, {"n": "Mont Salève cable car", "c": "option", "city": "Daytrip", "lat": 46.161259, "lng": 6.18805, "a": "Route du Téléphérique", "d": "Five-minute cable-car ride to 1,100 m Geneva views, with a free playground - great short mountain fix.", "u": "https://www.telepherique-du-saleve.com/", "t": "https://www.tripadvisor.com/Attraction_Review-g3566566-d2698600-Reviews-Telepherique_du_Saleve-Etrembieres_Haute_Savoie_Auvergne_Rhone_Alpes.html"}, {"n": "Château de Chillon", "c": "option", "city": "Daytrip", "lat": 46.413937, "lng": 6.927868, "a": "Avenue de Chillon 21", "d": "A real lakeside castle with dungeons and towers; indoors on wet days, but lots of stairs - bring a carrier.", "u": "https://www.chillon.ch/", "t": "https://www.tripadvisor.com/Attraction_Review-g911522-d246808-Reviews-Chateau_de_Chillon-Veytaux_Canton_of_Vaud.html"}, {"n": "Annecy old town & lake", "c": "option", "city": "Daytrip", "lat": 45.898325, "lng": 6.124555, "a": "Vieille Ville", "d": "Canals, swans and flat lakeside lawns - a pretty, cheaper French day out; carry passports.", "u": "https://annecy-tourisme.com/", "t": "https://www.tripadvisor.com/Attraction_Review-g187260-d6936678-Reviews-La_Vieille_Ville-Annecy_Haute_Savoie_Auvergne_Rhone_Alpes.html"}, {"n": "Gruyères village & castle", "c": "option", "city": "Daytrip", "lat": 46.584632, "lng": 7.083529, "a": "Rue du Château 8", "d": "Car-free hilltop village, castle and cheese dairy - fairy-tale scenery; family ticket and under-6s free.", "u": "https://www.chateau-gruyeres.ch/", "t": "https://www.tripadvisor.com/Attraction_Review-g198820-d775674-Reviews-Gruyeres_Castle-Gruyeres_La_Gruyere_Canton_of_Fribourg.html"}, {"n": "CERN Science Gateway", "c": "sight", "city": "Geneva", "lat": 46.233353, "lng": 6.055067, "a": "Esplanade des Particules 1", "d": "Free. Closed Mondays. Tram 18, about 25 minutes.", "u": "https://visit.cern/", "t": ""}, {"n": "Villars-Gryon ski area", "c": "ski", "city": "Daytrip", "lat": 46.297764, "lng": 7.055331, "a": "Villars-sur-Ollon", "d": "Beginner ski day. Train 1h53 via Aigle.", "u": "", "t": ""}, {"n": "Jardin Anglais & Flower Clock (L'Horloge Fleurie)", "c": "sight", "city": "Geneva", "lat": 46.204185, "lng": 6.150981, "a": "Quai du Général-Guisan / Jardin Anglais", "d": "Flat lakeside garden with the giant flower clock and Jet d'Eau views - an easy pushchair stroll.", "u": "https://www.geneve.com/en/see-do/attractions/top-10-things-to-do", "t": "https://www.tripadvisor.com/Attraction_Review-g188057-d2662521-Reviews-The_Flower_Clock-Geneva.html"}, {"n": "Mouettes Genevoises water taxis", "c": "sight", "city": "Geneva", "lat": 46.209285, "lng": 6.151256, "a": "Main pier: Quai du Mont-Blanc 8 (Pâquis); lines M1-M4 across the harbour", "d": "Little yellow boats crossing past the Jet d'Eau - a free mini cruise with the transport card.", "u": "https://www.geneve.com/en/attractions/detail/mouettes-genevoises", "t": "https://www.tripadvisor.com/Attraction_Review-g188057-d21493214-Reviews-Mouettes_Genevoises-Geneva.html"}, {"n": "CGN Belle Époque paddle steamers", "c": "sight", "city": "Geneva", "lat": 46.207963, "lng": 6.147296, "a": "Departures from Genève Mont-Blanc pier", "d": "Historic paddle wheels and engine room to watch; under-6s ride free, ideal for train-and-boat-loving toddlers.", "u": "https://www.cgn.ch/", "t": "https://www.tripadvisor.com/Attraction_Review-g188057-d9835742-Reviews-CGN-Geneva.html"}, {"n": "Lavaux vineyard terraces", "c": "option", "city": "Daytrip", "lat": 46.488325, "lng": 6.72968, "a": "Lavaux UNESCO area", "d": "Train-hop UNESCO terraces with lake views; paved paths work for a pushchair on short stretches.", "u": "https://www.lavaux-unesco.ch/", "t": "https://www.tripadvisor.com/Attraction_Review-g1133410-d8715706-Reviews-Lavaux_Vineyard_Terraces-Grandvaux_Bourg_en_Lavaux_Canton_of_Vaud.html"}, {"n": "Café du Soleil", "c": "eat", "city": "Geneva", "lat": 46.223235, "lng": 6.127671, "a": "Place du Petit-Saconnex 6", "d": "Order the house Gruyère AOP fondue with crusty bread; Geneva's classic neighbourhood fondue café, open every day, so book ahead.", "u": "https://www.cafedusoleil.ch/", "t": "https://www.tripadvisor.com/Restaurant_Review-g188057-d751711-Reviews-Cafe_du_Soleil-Geneva.html"}, {"n": "Restaurant Les Armures", "c": "eat", "city": "Geneva", "lat": 46.201305, "lng": 6.147276, "a": "Rue du Puits-Saint-Pierre 1", "d": "Moitié-moitié fondue (Vacherin and Gruyère) with a Valais dried-meat plate, in a beamed Old Town dining room full of armour.", "u": "https://www.lesarmures.ch/restaurant/", "t": "https://www.tripadvisor.com/Restaurant_Review-g188057-d697870-Reviews-Restaurant_Les_Armures-Geneva.html"}, {"n": "Brasserie-Restaurant de l'Hôtel-de-Ville", "c": "eat", "city": "Geneva", "lat": 46.201261, "lng": 6.14689, "a": "Grand-Rue 39", "d": "Order the moitié-moitié fondue that won the 2024 Cook'n'Cheese Gruyère AOP prize, served beside the cantonal parliament.", "u": "https://www.restaurant-hoteldeville.ch/", "t": "https://www.tripadvisor.com/Restaurant_Review-g188057-d877866-Reviews-Brasserie_Restaurant_de_l_Hotel_de_Ville-Geneva.html"}, {"n": "Restaurant Edelweiss", "c": "eat", "city": "Geneva", "lat": 46.211398, "lng": 6.14992, "a": "Place de la Navigation 2", "d": "Unabashedly touristy chalet evening: cheese fondue or raclette with live alphorn, accordion and yodelling; a toddler will love the music.", "u": "https://www.hoteledelweissgeneva.com/fr/edelweiss.html", "t": "https://www.tripadvisor.com/Restaurant_Review-g188057-d1044937-Reviews-Restaurant_Edelweiss-Geneva.html"}, {"n": "La Buvette des Bains des Pâquis", "c": "eat", "city": "Geneva", "lat": 46.210156, "lng": 6.1544, "a": "Quai du Mont-Blanc 30", "d": "Cheap self-service plat du jour on a pier in the lake; in winter book the famous crémant fondue in the wood-heated cabin.", "u": "https://aubp.ch/buvette/", "t": "https://www.tripadvisor.com/Restaurant_Review-g188057-d795460-Reviews-La_Buvette_Des_Bains_Des_Paquis-Geneva.html"}, {"n": "Da Paolo", "c": "eat", "city": "Geneva", "lat": 46.204745, "lng": 6.157091, "a": "Rue du Lac 3", "d": "Wood-fired pizzas in a noisy family-run Eaux-Vives institution, open daily from 11:30, steps from the Jet d'Eau waterfront.", "u": "https://dapaolo.ch/", "t": "https://www.tripadvisor.com/Restaurant_Review-g188057-d776629-Reviews-Da_Paolo-Geneva.html"}, {"n": "Café des Négociants", "c": "eat", "city": "Geneva", "lat": 46.185703, "lng": 6.140508, "a": "Rue de la Filature 29", "d": "Lyon-style bouchon in Carouge: escargots, Léman perch fillets, then let staff pull a Geneva bottle from the walk-in cellar.", "u": "https://negociants.ch/fr/", "t": "https://www.tripadvisor.com/Restaurant_Review-g664427-d697926-Reviews-Cafe_Des_Negociants-Carouge.html"}, {"n": "Cottage Café", "c": "eat", "city": "Geneva", "lat": 46.208694, "lng": 6.148514, "a": "Rue Adhémar-Fabri 7", "d": "Bircher muesli and coffee by day, tapas by night, in a tiny garden beside the Brunswick Monument facing the Jet d'Eau.", "u": "https://www.cottagecafe.ch/", "t": "https://www.tripadvisor.com/Restaurant_Review-g188057-d2067022-Reviews-Cottage_Cafe-Geneva.html"}, {"n": "UVA Genève", "c": "wine", "city": "Geneva", "lat": 46.206032, "lng": 6.143098, "a": "Rue des Étuves 1", "d": "Swiss-only wine list with a Geneva focus; order local Chasselas or Gamaret with a Genevan cheese and charcuterie board.", "u": "https://www.uva-geneve.com/", "t": ""}, {"n": "Chez Bacchus", "c": "wine", "city": "Geneva", "lat": 46.201988, "lng": 6.153137, "a": "Cours de Rive 7", "d": "Wine bar of the Caveau de Bacchus merchant: about 40 wines by the glass from 800-plus, with bistronomic plates to share.", "u": "https://caveaudebacchus.ch/pages/nous-rendre-visite", "t": "https://www.tripadvisor.com/Restaurant_Review-g188057-d20266759-Reviews-Chez_Bacchus-Geneva.html"}, {"n": "Le Blanc Valet", "c": "wine", "city": "Geneva", "lat": 46.203193, "lng": 6.158465, "a": "Rue Henri-Blanvalet 11", "d": "Lively Eaux-Vives wine bistro with local and rare bottles at fair prices; ask which of the rotating by-the-glass wines are Genevan.", "u": "", "t": ""}, {"n": "La Cave de Genève", "c": "wine", "city": "Geneva", "lat": 46.222115, "lng": 6.054194, "a": "Rue du Pré-Bouvier 30", "d": "The canton's big growers' cooperative in Satigny, Switzerland's largest wine commune: taste and buy Geneva Chasselas, Gamay and Gamaret.", "u": "https://www.cavedegeneve.ch/en_GB", "t": ""}, {"n": "Du Rhône Chocolatier", "c": "chocolate", "city": "Geneva", "lat": 46.202486, "lng": 6.154743, "a": "Rue du Rhône 118", "d": "Geneva's oldest chocolatier, founded 1875: try the Pavés 1875 or Nobles du Rhône, then a hot chocolate in the tea room.", "u": "https://durhonechocolatier.ch/", "t": "https://www.tripadvisor.com/Restaurant_Review-g188057-d1200770-Reviews-Du_Rhone_Chocolatier-Geneva.html"}, {"n": "Favarger (Boutique Marché & Atelier)", "c": "chocolate", "city": "Geneva", "lat": 46.202894, "lng": 6.147503, "a": "Rue du Marché 38", "d": "Since 1826: buy Avelines and Nougalines, then mould your own bars at the walk-in workshop, CHF 20, no booking needed.", "u": "https://www.favarger.com/pages/boutiques", "t": ""}, {"n": "Chocolatier Auer", "c": "chocolate", "city": "Geneva", "lat": 46.202241, "lng": 6.150262, "a": "Rue de Rive 4", "d": "Family-run since 1939; the must-buy is the chocolate-coated Amandes Princesse almonds, which reviewers call unbeatable.", "u": "https://chocolat-auer.ch/", "t": "https://www.tripadvisor.com/Restaurant_Review-g188057-d1200542-Reviews-Auer-Geneva.html"}, {"n": "Philippe Pascoët", "c": "chocolate", "city": "Geneva", "lat": 46.186117, "lng": 6.140682, "a": "Rue Saint-Joseph 12", "d": "Master chocolatier's original Carouge shop and workshop; try the 'Adrien' and 'Passion' ganaches, which have short shelf lives.", "u": "https://www.pascoet.com/nos-boutiques/", "t": ""}, {"n": "Sweetzerland", "c": "chocolate", "city": "Geneva", "lat": 46.207538, "lng": 6.146347, "a": "Rue du Mont-Blanc 5", "d": "Bright modern chocolatier on the walk from Cornavin to the lake, known for truffles, chocolate almonds and a richly praised hot chocolate.", "u": "https://www.sweetzerland.net/", "t": ""}, {"n": "Boréal Coffee Shop (Stand)", "c": "coffee", "city": "Geneva", "lat": 46.203534, "lng": 6.140935, "a": "Rue du Stand 60", "d": "Geneva's own specialty roaster since 2009; get a flat white or filter of house-roasted beans and a cinnamon roll.", "u": "https://borealcoffee.ch/locations/", "t": "https://www.tripadvisor.com/Restaurant_Review-g188057-d2453411-Reviews-Boreal_Coffee_Shop_Stand-Geneva.html"}, {"n": "Birdie Food & Coffee", "c": "coffee", "city": "Geneva", "lat": 46.199976, "lng": 6.137757, "a": "Rue des Bains 40", "d": "Pioneer of Geneva's specialty scene since 2014, rotating guest roasters; go for weekend brunch, but there are no reservations.", "u": "https://www.instagram.com/birdiecoffee/", "t": ""}, {"n": "My Little Cup (Rive Gauche)", "c": "coffee", "city": "Geneva", "lat": 46.203532, "lng": 6.1574, "a": "Rue des Eaux-Vives 15", "d": "Specialty bar a stone's throw from the Jet d'Eau, pulling Colonna espresso with rotating filter roasters; open weekend mornings.", "u": "https://www.mylittlecup.ch/", "t": ""}, {"n": "La Clémence", "c": "coffee", "city": "Geneva", "lat": 46.200193, "lng": 6.148758, "a": "Place du Bourg-de-Four 20", "d": "Historic Old Town café since 1950: an espresso or winter vin chaud on the terrace overlooking Place du Bourg-de-Four.", "u": "https://www.laclemence.ch/", "t": "https://www.tripadvisor.com/Restaurant_Review-g188057-d1068860-Reviews-La_Clemence-Geneva.html"}, {"n": "Café Remor", "c": "coffee", "city": "Geneva", "lat": 46.201499, "lng": 6.139887, "a": "Place du Cirque 3", "d": "Old-school 1921 café-glacier at Place du Cirque: coffee for you, homemade ice cream or banana split for the toddler.", "u": "", "t": ""}, {"n": "Montreux Noël Christmas market", "c": "sight", "city": "Daytrip", "lat": 46.43182, "lng": 6.910113, "a": "Quais and Place du Marché", "d": "December. 150+ lit chalets on the lake; Santa flies over the market every evening. 64 min by direct train.", "u": "https://www.montreuxnoel.com/", "t": "https://www.tripadvisor.com/Attraction_Review-g188108-d2399821-Reviews-Christmas_Market_in_Montreux-Montreux_Canton_of_Vaud.html"}];
</script>
<script>
(function(){
  var COL={hotel:"#14212B",sight:"#1F5673",eat:"#C8102E",wine:"#7A3B5E",chocolate:"#6F4E37",coffee:"#A0672F",option:"#5E8C9E",ski:"#36584A"};
  var LABEL={hotel:"Hotel",sight:"Sight",eat:"Restaurant",wine:"Wine",chocolate:"Chocolate",coffee:"Coffee bar",option:"If plans change",ski:"Ski day"};
  var WALK=80; // metres per minute, an unhurried city pace
  var map=L.map("map",{zoomControl:true,scrollWheelZoom:true}).setView([46.2044,6.1432],14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  function metres(a,b){
    var R=6371000, t=Math.PI/180;
    var dLa=(b.lat-a.lat)*t, dLo=(b.lng-a.lng)*t;
    var s=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLo/2)*Math.sin(dLo/2);
    return 2*R*Math.asin(Math.sqrt(s));
  }
  var markers=[], circles=L.layerGroup().addTo(map), current=null;

  function popupHTML(p, from){
    var title = p.u ? '<a href="'+p.u+'" target="_blank" rel="noopener">'+p.n+'</a>' : p.n;
    var h='<span class="pop-n">'+title+'</span><span class="pop-a">'+LABEL[p.c]+(p.a?" &middot; "+p.a:"")+'</span>';
    if(p.d) h+='<span class="pop-d">'+p.d+'</span>';
    if(p.t) h+='<span class="pop-d"><a href="'+p.t+'" target="_blank" rel="noopener">reviews on Tripadvisor</a></span>';
    if(from && from!==p){
      var m=metres(from,p);
      h+='<span class="pop-w">'+Math.round(m)+' m from '+from.n+' &mdash; about '+Math.max(1,Math.round(m/WALK))+' min on foot</span>';
    }
    if(p.c==="hotel") h+='<button class="walkbtn" type="button" data-walk="'+p.n+'">walking circles from here</button>';
    return h;
  }
  function redrawPopups(){
    markers.forEach(function(m){ m.setPopupContent(popupHTML(m.place, current)); });
  }
  function showPanel(p){
    hidePanel();
    var near={5:0,10:0,15:0}, closest=null, closestMin=1e9;
    PLACES.forEach(function(q){
      if(q===p || q.c==="hotel" || q.c==="option" || q.city!==p.city) return;
      var mins=metres(p,q)/WALK;
      if(mins<closestMin){ closestMin=mins; closest=q; }
      if(mins<=5) near[5]++; if(mins<=10) near[10]++; if(mins<=15) near[15]++;
    });
    var d=L.DomUtil.create("div","panel"); d.id="walkpanel";
    d.innerHTML='<button class="close" type="button" aria-label="Close">&times;</button>'+
      '<b>'+p.n+'</b><br>Within a walk of:<br>'+
      '&bull; 5 min &mdash; '+near[5]+' places<br>'+
      '&bull; 10 min &mdash; '+near[10]+' places<br>'+
      '&bull; 15 min &mdash; '+near[15]+' places<br>'+
      (closest ? '<span class="pop-a">nearest: '+closest.n+', about '+Math.max(1,Math.round(closestMin))+' min</span><br>' : '')+
      '<span class="hint">Straight-line circles. The harbour adds a bridge &mdash; or take a Mouette.</span>';
    document.getElementById("map").appendChild(d);
    L.DomEvent.disableClickPropagation(d);
    d.querySelector(".close").addEventListener("click",function(){hidePanel();circles.clearLayers();current=null;redrawPopups();});
  }
  function hidePanel(){ var e=document.getElementById("walkpanel"); if(e) e.remove(); }
  function drawWalk(p){
    circles.clearLayers(); current=p;
    [[5,.30],[10,.20],[15,.12]].forEach(function(pair){
      L.circle([p.lat,p.lng],{radius:pair[0]*WALK,color:"#6B7A4F",weight:1,
        fillColor:"#6B7A4F",fillOpacity:pair[1],interactive:false}).addTo(circles);
    });
    showPanel(p); redrawPopups();
    map.fitBounds(L.latLng(p.lat,p.lng).toBounds(15*WALK*2.4),{padding:[20,20]});
  }
  PLACES.forEach(function(p){
    var size=p.c==="hotel"?19:13;
    var icon=L.divIcon({className:"",iconSize:[size,size],iconAnchor:[size/2,size/2],
      html:'<div class="pin '+p.c+'" style="width:'+size+'px;height:'+size+'px;background:'+COL[p.c]+'"></div>'});
    var m=L.marker([p.lat,p.lng],{icon:icon,title:p.n,riseOnHover:true}).addTo(map);
    m.place=p; m.bindPopup(popupHTML(p,null),{maxWidth:260});
    m.on("popupopen",function(e){
      var b=e.popup.getElement().querySelector("[data-walk]");
      if(b) b.addEventListener("click",function(){ drawWalk(p); });
    });
    markers.push(m);
  });
  function bounds(city){
    var pts=markers.filter(function(m){return m.place.city===city;}).map(function(m){return m.getLatLng();});
    return L.latLngBounds(pts);
  }
  function go(city){
    circles.clearLayers(); hidePanel(); current=null; redrawPopups();
    map.flyToBounds(bounds(city),{padding:[30,30],duration:.8});
    document.querySelectorAll(".cities button").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.city===city));
    });
  }
  document.querySelectorAll(".cities button").forEach(function(b){
    b.addEventListener("click",function(){ go(b.dataset.city); });
  });
  document.querySelectorAll(".legend input").forEach(function(cb){
    cb.addEventListener("change",function(){
      markers.forEach(function(m){
        if(m.place.c!==cb.dataset.cat) return;
        if(cb.checked) m.addTo(map); else map.removeLayer(m);
      });
    });
  });
  map.fitBounds(bounds("Geneva"),{padding:[30,30]});
})();
</script>
